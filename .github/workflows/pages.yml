name: Publish wedding homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-publication.mjs
      - name: Set Pages project path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: echo "PAGES_BASE_PATH=/$REPOSITORY_NAME/" >> "$GITHUB_ENV"
      - run: npm run build
      - run: node scripts/check-publication.mjs --dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
